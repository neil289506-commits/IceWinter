name: Version Compatibility

on:
  push:
    paths:
      - ".github/workflows/compat.yml"
      - "tools/compat_check.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      VERSIONS: "26.1 26.1.1 26.1.2 26.2 26.3 26.4-snapshot-7"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build this mod (best effort)
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon -q || echo "build failed" > build-failed.txt
          ls build/libs 2>/dev/null || true

      - name: Download client jars and run checks
        run: |
          set -uo pipefail
          mkdir -p out jars
          MANIFEST=$(curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json)
          echo "$MANIFEST" | jq -r '.versions[].id' | grep -E '^26\.' | head -60 > out/available-26x-versions.txt
          MY_JAR=$(ls build/libs/*.jar 2>/dev/null | grep -v -- '-sources' | head -1 || true)
          for V in $VERSIONS; do
            META_URL=$(echo "$MANIFEST" | jq -r --arg v "$V" '.versions[] | select(.id==$v) | .url')
            if [ -z "$META_URL" ]; then echo "version $V not found" | tee -a out/summary.txt; continue; fi
            JAR_URL=$(curl -fsSL "$META_URL" | jq -r '.downloads.client.url')
            curl -fsSL "$JAR_URL" -o "jars/$V.jar"
            echo "== reference mod on $V" | tee -a out/summary.txt
            python3 tools/compat_check.py "jars/$V.jar" reference/ice_caves_backport-fabric-0_1_11_26_2.jar bananaman/ "out/ref-$V.json" 2>&1 | tee -a out/summary.txt
            if [ -n "$MY_JAR" ]; then
              echo "== this mod on $V" | tee -a out/summary.txt
              python3 tools/compat_check.py "jars/$V.jar" "$MY_JAR" backport/ "out/mine-$V.json" 2>&1 | tee -a out/summary.txt
            fi
          done

      - name: Push report to private branch ci-compat
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/push && cp -r out/* /tmp/push/ 2>/dev/null || true
          cd /tmp/push && git init -q && git checkout -q -b ci-compat
          git config user.name github-actions && git config user.email actions@github.com
          git add . && git commit -q -m "compat report" || true
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-compat
