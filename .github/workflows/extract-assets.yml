name: Extract Assets

on:
  push:
    paths:
      - ".github/workflows/extract-assets.yml"
  workflow_dispatch:
    inputs:
      old_version:
        description: Old version id
        default: "26.2"
      new_version:
        description: New version id
        default: "26.4-snapshot-7"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLD: ${{ inputs.old_version || '26.2' }}
      NEW: ${{ inputs.new_version || '26.4-snapshot-7' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download client jars and pick new/changed files
        run: |
          set -euo pipefail
          MANIFEST=$(curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json)
          for V in "$OLD" "$NEW"; do
            META_URL=$(echo "$MANIFEST" | jq -r --arg v "$V" '.versions[] | select(.id==$v) | .url')
            [ -n "$META_URL" ] || { echo "Version $V not found"; exit 1; }
            JAR_URL=$(curl -fsSL "$META_URL" | jq -r '.downloads.client.url')
            curl -fsSL "$JAR_URL" -o "c-$V.jar"
          done
          mkdir old new pick
          unzip -q "c-$OLD.jar" 'assets/*' 'data/*' -d old
          unzip -q "c-$NEW.jar" 'assets/*' 'data/*' -d new
          (cd new && find assets data -type f) | while read -r f; do
            if [ ! -f "old/$f" ] || ! cmp -s "old/$f" "new/$f"; then
              mkdir -p "pick/$(dirname "$f")"
              cp "new/$f" "pick/$f"
            fi
          done
          find pick -type f | wc -l
          du -sh pick

      - name: Push to private branch ci-assets
        run: |
          set -euo pipefail
          mkdir -p /tmp/push
          tar -czf /tmp/push/assets-new.tar.gz -C pick assets
          tar -czf /tmp/push/data-new.tar.gz -C pick data
          find pick -type f | sort > /tmp/push/file-list.txt
          find /tmp/push -size +90M -delete
          ls -lh /tmp/push
          cd /tmp/push && git init -q && git checkout -q -b ci-assets
          git config user.name github-actions && git config user.email actions@github.com
          git add . && git commit -q -m "assets $OLD -> $NEW"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-assets
