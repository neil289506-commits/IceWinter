name: Fabric Builds

on:
  push:
    branches:
      - Fabric
    paths:
      - "Fabric/**"
      - ".github/workflows/fabric.yml"
  pull_request:
    paths:
      - "Fabric/**"
      - ".github/workflows/fabric.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Fabric ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "26.1"
            allow_failure: false
          - version: "26.1.1"
            allow_failure: false
          - version: "26.1.2"
            allow_failure: false
          - version: "26.2"
            allow_failure: false
          - version: "26.3"
            allow_failure: false
    continue-on-error: ${{ matrix.allow_failure }}
    defaults:
      run:
        working-directory: Fabric/${{ matrix.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: icewinter-fabric-${{ matrix.version }}
          path: |
            Fabric/${{ matrix.version }}/build/libs/*.jar
            !Fabric/${{ matrix.version }}/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: icewinter-fabric-${{ matrix.version }}-failure
          path: |
            Fabric/${{ matrix.version }}/build/reports/
            Fabric/${{ matrix.version }}/build/test-results/
          if-no-files-found: ignore
