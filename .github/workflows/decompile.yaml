name: Diff Minecraft Versions

on:
  workflow_dispatch:
    inputs:
      old_version:
        description: Old version id (e.g. 26.2)
        default: "26.2"
      new_version:
        description: New version id (e.g. 26.4-snapshot-7)
        default: "26.4-snapshot-7"

permissions:
  contents: write

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OLD: ${{ inputs.old_version }}
      NEW: ${{ inputs.new_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Download client jars from Mojang
        run: |
          set -euo pipefail
          mkdir -p logs
          MANIFEST=$(curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json)
          for V in "$OLD" "$NEW"; do
            META_URL=$(echo "$MANIFEST" | jq -r --arg v "$V" '.versions[] | select(.id==$v) | .url')
            [ -n "$META_URL" ] || { echo "Version $V not found in manifest"; exit 1; }
            JAR_URL=$(curl -fsSL "$META_URL" | jq -r '.downloads.client.url')
            curl -fsSL "$JAR_URL" -o "client-$V.jar"
          done
          ls -lh *.jar

      - name: Download Vineflower
        run: |
          set -euo pipefail
          URL=$(gh api repos/Vineflower/vineflower/releases/latest \
            --jq '.assets[] | select(.name|test("^vineflower-[0-9.]+\\.jar$")) | .browser_download_url')
          echo "Vineflower: $URL"
          curl -fsSL -L "$URL" -o vineflower.jar

      - name: Decompile both versions
        run: |
          set -uxo pipefail
          { free -h; df -h .; nproc; java -version; } > logs/env.log 2>&1 || true
          mkdir -p out/old out/new
          for PAIR in "old:$OLD" "new:$NEW"; do
            D="${PAIR%%:*}"; V="${PAIR#*:}"
            java -Xmx6g -jar vineflower.jar -thr="$(nproc)" "client-$V.jar" "out/$D" > "logs/vf-$D.full.log" 2>&1 || echo "vineflower exit code $? for $D" >> logs/env.log
            tail -n 200 "logs/vf-$D.full.log" > "logs/vineflower-$D.log"
            rm -f "logs/vf-$D.full.log"
            if [ ! -d "out/$D/net/minecraft" ]; then echo "no decompiled output for $D" | tee -a logs/env.log; exit 1; fi
          done
          mv out/old old
          mv out/new new

      - name: Build diffs
        run: |
          mkdir -p result
          diff -rq old new | grep -v '\.class' > result/changed-files.txt || true
          diff -ruN old/net new/net > result/code.diff || true
          diff -ruN old/com new/com >> result/code.diff || true
          diff -ruN old/data new/data > result/data.diff || true
          diff -rq old/assets new/assets > result/assets-changed.txt || true
          grep '^Only in new' result/changed-files.txt > result/added-files.txt || true
          wc -l result/* | tee logs/summary.log

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: version-diff
          path: result/
          retention-days: 3

      - name: Push results to private branch ci-results
        if: success()
        run: |
          set -euo pipefail
          mkdir -p /tmp/push && cp -r result/* logs/* /tmp/push/
          gzip -f /tmp/push/code.diff /tmp/push/data.diff
          tar -czf /tmp/push/old-src.tar.gz -C old net com
          tar -czf /tmp/push/new-src.tar.gz -C new net com
          find /tmp/push -size +90M -delete
          cd /tmp/push && git init -q && git checkout -q -b ci-results
          git config user.name github-actions && git config user.email actions@github.com
          git add . && git commit -q -m "diff $OLD -> $NEW"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-results

      - name: Push logs to private branch ci-logs on failure
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p /tmp/push && cp -r logs/* /tmp/push/ 2>/dev/null || true
          cd /tmp/push && git init -q && git checkout -q -b ci-logs
          git config user.name github-actions && git config user.email actions@github.com
          git add . && git commit -q -m "failure logs" || echo "nothing to commit"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-logs
