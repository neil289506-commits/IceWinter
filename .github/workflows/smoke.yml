name: Smoke Test (dedicated server)

on:
  push:
    paths:
      - "smoke.trigger"
      - ".github/workflows/smoke.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4

      - name: Run dedicated server and exercise the mod
        run: |
          chmod +x ./gradlew
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-seed=12345\nview-distance=4\nsimulation-distance=4\nspawn-protection=0\n" > run/server.properties
          rm -f /tmp/cmd; mkfifo /tmp/cmd
          (tail -f /tmp/cmd | ./gradlew runServer --no-daemon --console=plain > server.log 2>&1) &
          for i in $(seq 1 120); do sleep 5; grep -q 'Done (' server.log && break; grep -q 'BUILD FAILED' server.log && break; done
          send() { echo "$1" > /tmp/cmd; sleep "${2:-4}"; }
          if grep -q 'Done (' server.log; then
            send "forceload add -48 -48 48 48" 3
            send "setblock 0 120 0 icewinter:icicle" 2
            send "setblock 2 120 0 icewinter:brittle_ice" 2
            send "setblock 4 120 0 icewinter:ice_crystal" 2
            send "setblock 6 120 0 icewinter:calcite_pillar[axis=x]" 2
            send "setblock 8 120 0 icewinter:packed_ice_brick_wall" 2
            send "summon icewinter:frostbite 0 125 0" 3
            send "summon icewinter:ice_ball 0 125 4" 2
            send "effect give @e[type=icewinter:frostbite,limit=1] icewinter:freezing 5" 2
            send "loot spawn 0 126 0 loot icewinter:blocks/icicle" 2
            send "loot spawn 0 126 0 loot icewinter:entities/frostbite" 2
            send "locate biome icewinter:ice_caves" 8
            send "forceload add 700 600 840 700" 90
            send "forceload query" 3
            send "setblock 2 119 0 icewinter:chiseled_soulshale" 2
            send "stop" 20
          fi
          sleep 10; pkill -f "tail -f /tmp/cmd" || true; pkill -f gradle || true
          tail -n 5 server.log

      - name: Push log to private branch ci-smoke
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/push
          cp server.log /tmp/push/server-full.log 2>/dev/null || true
          grep -n -E "ERROR|Exception|FATAL|Failed|Couldn't|Could not|Unknown|Summoned|Changed the block|Located|Spawned|Applied effect|Done \(" server.log | head -200 > /tmp/push/findings.log || true
          tail -n 120 server.log > /tmp/push/tail.log || true
          cd /tmp/push && git init -q && git checkout -q -b ci-smoke
          git config user.name github-actions && git config user.email actions@github.com
          git add . && git commit -q -m "smoke test log" || true
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-smoke
